# 主前端目录：apps/frontend（与 apps/frontend-current 无关）
name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: imagentx_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      rabbitmq:
        image: rabbitmq:3-management
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5672:5672

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Cache Maven packages
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Run unit tests
      run: |
        cd apps/backend
        mvn test -Dtest="**/*Test" -DfailIfNoTests=false

    - name: Run integration tests
      run: |
        cd apps/backend
        mvn test -Dtest="**/*IntegrationTest" -DfailIfNoTests=false

    - name: Generate coverage report
      run: |
        cd apps/backend
        mvn jacoco:report

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./apps/backend/target/site/jacoco/jacoco.xml
        flags: backend
        name: backend-coverage
        fail_ci_if_error: false

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: 'apps/frontend/package-lock.json'

    - name: Install dependencies
      run: |
        cd apps/frontend
        npm ci

    - name: Run unit tests
      run: |
        cd apps/frontend
        npm test -- --coverage --watchAll=false --passWithNoTests

    - name: Run E2E tests
      run: |
        cd apps/frontend
        npm run build
        npm run start &
        npm run test:e2e

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./apps/frontend/coverage/lcov.info
        flags: frontend
        name: frontend-coverage
        fail_ci_if_error: false

  # 仓库中尚无 integration-tests/performance；若开启会在 backend 通过后因目录不存在而失败。
  test-performance:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: [test-backend]
    if: false

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Start backend service
      run: |
        cd apps/backend
        mvn spring-boot:run -Dspring-boot.run.profiles=test &
        sleep 60

    - name: Run performance tests
      run: |
        cd integration-tests/performance
        mvn test -Dtest="PerformanceTest"

  # OWASP ZAP：普通 push 不跑（耗时且需完整环境）。在 Actions 中「Run workflow」手动触发时再执行。
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 120

    services:
      rabbitmq:
        image: rabbitmq:3-management
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build backend JAR
      run: |
        cd apps/backend
        mvn -B -DskipTests package

    - name: Start backend (H2 + RabbitMQ)
      run: |
        cd apps/backend
        nohup java -jar target/imagent-x-0.0.1-SNAPSHOT.jar --spring.profiles.active=h2 > /tmp/backend.log 2>&1 &
        for i in $(seq 1 90); do
          if curl -sf http://localhost:8088/api/health; then
            echo "Backend is up"
            exit 0
          fi
          sleep 2
        done
        echo "Backend failed to start. Last logs:"
        tail -200 /tmp/backend.log
        exit 1

    - name: Run OWASP ZAP scan
      uses: zaproxy/action-full-scan@v0.8.0
      with:
        target: 'http://localhost:8088'

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: always()

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check test results
      run: |
        echo "Checking test results..."
        if [ "${{ needs.test-backend.result }}" != "success" ]; then
          echo "❌ Backend tests failed"
          exit 1
        fi
        if [ "${{ needs.test-frontend.result }}" != "success" ]; then
          echo "❌ Frontend tests failed"
          exit 1
        fi
        echo "✅ All tests passed"

    - name: Check coverage thresholds
      run: |
        echo "Checking coverage thresholds..."
        # Add coverage threshold checks here
        echo "✅ Coverage thresholds met"

    - name: Generate test report
      run: |
        echo "## Test Results" >> $GITHUB_STEP_SUMMARY
        echo "- Backend Tests: ${{ needs.test-backend.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Frontend Tests: ${{ needs.test-frontend.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Performance Tests: ${{ needs.test-performance.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Security Scan: ${{ needs.security-scan.result }}" >> $GITHUB_STEP_SUMMARY
