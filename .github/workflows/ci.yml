# 前端唯一入口：apps/frontend（勿使用 apps/frontend-current）
name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  repo-guard:
    name: Repo Guard
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Verify no legacy frontend path
      run: |
        chmod +x scripts/testing/check-legacy-paths.sh
        ./scripts/testing/check-legacy-paths.sh

    - name: Verify langchain4j upstream coordinates
      run: |
        chmod +x scripts/testing/check-langchain4j-upstream.sh
        ./scripts/testing/check-langchain4j-upstream.sh

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: [repo-guard]
    
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: imagentx_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      rabbitmq:
        image: rabbitmq:3-management
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5672:5672

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Cache Maven packages
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('apps/backend/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Run backend tests
      run: |
        cd apps/backend
        mvn test -DfailIfNoTests=false

    - name: Generate coverage report
      run: |
        cd apps/backend
        mvn jacoco:report

  langchain4j-compat:
    name: LangChain4j Compatibility
    runs-on: ubuntu-latest
    needs: [repo-guard]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Run langchain4j compatibility suite
      run: |
        cd apps/backend
        mvn test -Dtest=LangChain4jCompatibilityTest,HealthControllerWebMvcTest,MCPGatewayServiceTest,TraceContextFilterTest

  langchain4j-smoke:
    name: LangChain4j Smoke
    runs-on: ubuntu-latest
    needs: [repo-guard]

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: imagentx
          POSTGRES_USER: imagentx_user
          POSTGRES_PASSWORD: imagentx_pass
        options: >-
          --health-cmd "pg_isready -U imagentx_user -d imagentx"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      mcp-gateway:
        image: ghcr.io/lucky-aeon/mcp-gateway:latest
        env:
          MCP_GATEWAY_API_KEY: default-api-key-1234567890
          MCP_GATEWAY_PORT: 8080
        ports:
          - 8081:8080

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Install PostgreSQL client
      run: |
        sudo apt-get update
        sudo apt-get install -y postgresql-client

    - name: Prepare pgvector extension
      run: |
        PGPASSWORD="imagentx_pass" psql -h localhost -p 5432 -U imagentx_user -d imagentx -c "CREATE EXTENSION IF NOT EXISTS vector;"

    - name: Apply and verify core schema migration
      run: |
        PGPASSWORD="imagentx_pass" psql -h localhost -p 5432 -U imagentx_user -d imagentx -f "config/database/sql/02_migrate_agent_execution_schema.sql"
        PGPASSWORD="imagentx_pass" psql -h localhost -p 5432 -U imagentx_user -d imagentx -f "config/database/sql/03_verify_agent_execution_schema.sql"

    - name: Run langchain4j smoke script
      run: |
        chmod +x scripts/testing/langchain4j-smoke.sh scripts/testing/check-langchain4j-upstream.sh
        BACKEND_HEALTH_URL='' \
        OPENAI_API_KEY='' \
        ANTHROPIC_API_KEY='' \
        MCP_GATEWAY_BASE_URL='http://localhost:8081' \
        MCP_GATEWAY_API_KEY='default-api-key-1234567890' \
        MCP_GATEWAY_ALLOW_401_AS_HEALTHY='true' \
        PGHOST='localhost' \
        PGPORT='5432' \
        PGDATABASE='imagentx' \
        PGUSER='imagentx_user' \
        PGPASSWORD='imagentx_pass' \
        ./scripts/testing/langchain4j-smoke.sh

    - name: Upload smoke report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: langchain4j-smoke-report
        path: reports/smoke/*.md
        if-no-files-found: ignore

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: [repo-guard]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: 'apps/frontend/package-lock.json'

    - name: Install dependencies
      run: |
        cd apps/frontend
        npm ci

    - name: Run tests
      run: |
        cd apps/frontend
        npm test -- --coverage --watchAll=false --passWithNoTests

    - name: Build frontend
      run: |
        cd apps/frontend
        npm run build

    - name: Run Playwright smoke tests
      run: |
        cd apps/frontend
        npx playwright install --with-deps chromium
        npm run test:e2e

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, langchain4j-compat, langchain4j-smoke]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker images (smoke)
      run: |
        docker build -f apps/backend/Dockerfile -t imagentx-ci-backend:local ./apps/backend
        docker build -f apps/frontend/Dockerfile -t imagentx-ci-frontend:local ./apps/frontend

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, langchain4j-compat, langchain4j-smoke, docker-build]
    if: always()

    steps:
    - name: Check test results
      run: |
        echo "## Test Results" >> $GITHUB_STEP_SUMMARY
        echo "- Backend Tests: ${{ needs.test-backend.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Frontend Tests: ${{ needs.test-frontend.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- LangChain4j Compatibility: ${{ needs.langchain4j-compat.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- LangChain4j Smoke: ${{ needs.langchain4j-smoke.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Docker Build: ${{ needs.docker-build.result }}" >> $GITHUB_STEP_SUMMARY
        
        if [ "${{ needs.test-backend.result }}" != "success" ]; then
          echo "❌ Backend tests failed"
          exit 1
        fi
        if [ "${{ needs.test-frontend.result }}" != "success" ]; then
          echo "❌ Frontend tests failed"
          exit 1
        fi
        if [ "${{ needs.langchain4j-compat.result }}" != "success" ]; then
          echo "❌ LangChain4j compatibility tests failed"
          exit 1
        fi
        if [ "${{ needs.langchain4j-smoke.result }}" != "success" ]; then
          echo "❌ LangChain4j smoke tests failed"
          exit 1
        fi
        if [ "${{ needs.docker-build.result }}" != "success" ]; then
          echo "❌ Docker build failed"
          exit 1
        fi
        echo "✅ All tests passed"
