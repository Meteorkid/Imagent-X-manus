version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: imagentx-redis
    ports:
      - "6379:6379"
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf
      - redis_data:/data
    command: redis-server /usr/local/etc/redis/redis.conf
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    networks:
      - cache_network

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: imagentx-redis-commander
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - cache_network

volumes:
  redis_data:
    driver: local

networks:
  cache_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/16
